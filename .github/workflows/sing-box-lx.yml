on:
  workflow_dispatch:
  schedule:
    - cron: 0 4 * * *

name: sing-box-lx

jobs:
  sing-box-lx:
    runs-on: ubuntu-latest
    env:
      working-directory: ./sing-box-lx
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get latest tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/Leadaxe/sing-box-lx/releases/latest | jq -r '.tag_name')
          echo "Latest version: $TAG"
          echo TAG=$TAG >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.working-directory }}
          platforms: |
            linux/amd64
            linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            rdbg/sing-box-lx:${{ env.TAG }}
            rdbg/sing-box-lx:latest
          build-args: |
            TAG=${{ env.TAG }}
